name: live_voice
description: Tour Guide Live Voice - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # HTTP
  http: ^1.1.0

  # WebSocket
  socket_io_client: ^2.0.3

  # LiveKit
  livekit_client: ^2.1.0

  # Storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.0.1

  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
